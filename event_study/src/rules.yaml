# 事件分類規則詞典（凍結後以 classifier.rules_version() 記錄版本雜湊）。
# 詞條語法：純字串=字面比對；"re:..."=正規表示式；尾綴 "@權重"（預設 1）。
# 命中計分：標題命中 2×權重、內文命中 1×權重（同一詞兩處都中則相加）。
# triggers 決定類別（分數 >= min_trigger_score 才成立）；pos/neg 決定方向
#   score = Σ正 - Σ負；否定詞在情緒詞前 negation_window_chars 字內（遇標點截斷）則反轉；|score|<1 -> 0。
# 較長的命中優先（如「豁免關稅」優先於「關稅」）。

global:
  min_trigger_score: 2
  max_secondary_categories: 2     # 除主類別外，標題也命中觸發詞的次要類別（cat_rank 2,3）
  priority: [18, 1, 11, 3, 2]     # 同分時的類別優先序，其餘依編號
  title_strip_prefix:             # 公告標題前綴（不影響比對）
    - "re:^\\s*[【\\[\\(（]?重大訊息[】\\]\\)）]?\\s*[:：\\-－]?\\s*"
    - "re:^\\s*[【\\[]?(公告|即時|快訊)[】\\]]?\\s*[:：]\\s*"
  negations:
    - "re:未(?!來|必|滿|曾)"
    - "re:不(?!僅|只|論|但|排除|斷|少|止|限|同|動產|得不|僅)"
    - "re:無(?!縫|懼|線|人|限|形|條件)"
    - 沒有
    - 並未
    - 尚未
    - 否認
    - "re:非(?!常)"
    - 難以
    - 無法
    - 取消
    - 撤回
    - 撤銷
    - 終止
    - 暫緩
    - 缺乏
  # 澄清/否認/闢謠稿：標題命中，或內文命中 >= 2 個不同詞，標記 is_clarification，不進主檢定
  clarification:
    - 澄清
    - 否認
    - 闢謠
    - 謠言
    - 不實
    - 與事實不符
    - 與事實有出入
    - 無此事
    - 並無此事
    - 未有此事
    - 傳聞落空
    - 傳言落空
    - "re:無.{0,6}之虞"
    - "re:回應(市場|媒體|外界|傳聞|報導|關切)"
    - "re:(並未|並無|尚無|沒有).{0,14}(傳聞|傳言|報導|消息|謠)"
  # 連結個股時忽略的過短/過泛別名
  alias_stoplist: [台灣, 中華, 國際, 科技, 電子, 公司, 集團, 工業, 企業, 投資, 實業, 中國, 美國, 日本]
  code_follow_units: "元億萬點張股年月日季度%％筆家檔美港倍成"

