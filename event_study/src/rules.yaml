    neg: [虧損@2, 轉虧@2, 衰退@1, 年減@1, 季減@1, 下修@2, 不如預期@2, 低於預期@2, 下滑@1, 大減@1, 虧@1, 獲利縮水@2, 縮水@1, 獲利下降@2, 稅後純損@2, 毛利率下滑@2, 保守@1]

